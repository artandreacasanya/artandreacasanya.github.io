<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casanya — Artista</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CABECERA Y NAVEGACIÓN -->
    <header class="navbar">
        <div class="nav-left">
            <a href="index.html">
                <img src="casanya.png" alt="Casanya" class="nav-logo">
            </a>
        </div>
        
        <nav class="nav-right">
            <a href="#obras"><img src="obras.png" alt="Obras" class="nav-item-img"></a>
            <a href="#proceso"><img src="proceso.png" alt="Proceso" class="nav-item-img"></a>
            <a href="#sobre-mi"><img src="sobre_mi.png" alt="Sobre mi" class="nav-item-img"></a>
            <a href="#contacto"><img src="contacto.png" alt="Contacto" class="nav-item-img"></a>
            
            <div class="lang-selector">
                <a href="?lang=es" class="lang-btn active"><img src="es.png" alt="ES" class="lang-img"></a>
                <span class="lang-divider"><img src="barra.png" alt="/" class="lang-img-divider"></span>
                <a href="?lang=en" class="lang-btn"><img src="en.png" alt="EN" class="lang-img"></a>
            </div>
        </nav>
    </header>

    <!-- SECCIÓN DE PORTADA / OBRAS -->
    <main>
        <section id="obras" class="section-container">
            <!-- Título secundario compuesto -->
            <div class="section-title-container">
                <img src="obras.png" alt="Obras" class="title-obras-img">
                <img src="guion.png" alt="-" class="title-guion-img">
                <img src="serie_paris.png" alt="Serie París 2025" class="title-serie-img">
            </div>

            <!-- Imagen principal de la obra -->
            <div class="hero-image-container">
                <img src="foto_portada.jpg" alt="Obra de arte Casanya" class="hero-image">
            </div>
        </section>
    </main>

</body>
</html>
