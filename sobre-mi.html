<body>

    <div class="site-container">

        <header class="navbar">
            <div class="nav-left">
                <a href="index.html">
                    <img src="casanya.png" alt="Casanya" class="nav-logo">
                </a>
            </div>
            
            <nav class="nav-right">
                <a href="index.html#obras"><img src="obras.png" alt="Obras" class="nav-item-img nav-item-obras"></a>

                    </div>
